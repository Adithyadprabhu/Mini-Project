# ==============================================================================
# Atlanta Sentinel AI-Powered Tourist Safety System - Nginx Subdomain Reverse Proxy
# Domain Configuration for:
#   1. tourist.yourdomain.com
#   2. admin.yourdomain.com
#   3. police.yourdomain.com
# ==============================================================================

# Global HTTP to HTTPS redirection
server {
    listen 80;
    listen [::]:80;
    server_name tourist.yourdomain.com admin.yourdomain.com police.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 1. TOURIST APPLICATION (tourist.yourdomain.com)
# Standalone installable mobile application for tourists
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tourist.yourdomain.com;

    # SSL Certificate Configuration (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shared Backend & Application Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

